<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <link rel="stylesheet" href="../css/bootstrap.min.css">
    <style>
        .fluid-container{
            display: grid;
            grid-template-columns: 1fr 2fr;
            grid-template-areas: 
            "head head"
            "sidebar content"
            "footer footer";            
            grid-template-rows: repeat(autofit,minmax(250px,1fr));
            min-height: 100dvh;
        }

        .fluid-container div{
            min-width: 200px;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #FFF !important;
            font-weight: bold;
            font-size: 1.5rem;
        }
        .head{grid-area: head;}
        .sidebar{grid-area: sidebar;}
        .content{grid-area: content;}
        .footer{grid-area: footer;}

        .input-group{
            position: relative;
            padding: 0 4px;
        }

        .input-group #textInput{
            width: 900px;
            height: 20px;
            padding: 4px 10px;
            font-size: 13px;
            color: black;
            border: none;
            outline: none;
            border-radius: 7px;
        }

        .input-group button{
            height: 30px;
            font-size: 16px;
            border: none;
            position: absolute;
            left :230px;
            border-radius: 9px;
        }
    </style>
</head>
<body>
    <div class="fluid-container bg-dark text-success">
        <div class="head text-primary bg-secondary">HEAD</div>
        <div class="sidebar bg-warning">SIDE BAR</div>
        <div class="content bg-primary">CONTENTS</div>
        <div class="footer bg-danger">FOOTER</div>
        <div class="input-group">
            <input id="textInput" type="text" value="20060518-59121-0000-127">
            <button type="button" id="copyBtn" onclick="myFunction();">COPY</button>
        </div>

    </div>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script>
        function myFunction(){
            const text = document.getElementById('textInput');
            text.select();
            navigator.clipboard.writeText(text.value);
            alert("text copied to clipboard");
        }
    </script>
</body>
</html>
