<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ISAAC FLEX BOX</title>
  <link rel="icon" type='image/x-icon' href="favicon.ico" >
  <style>
    :root {
      --accent: #00ffcc;
      --page-bg: #111;
      --panel-bg: #141414;
      --text: #00ffcc;
      --muted: #9bbdb7;
      --border: #777;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 16px 16px 250px;
      background: var(--page-bg);
      color: var(--text);
      text-align: center;
      font-family: system-ui, Arial, sans-serif;
    }

    h2 {
      margin: 8px 0 26px;
      position: relative;
      padding: 0 120px 12px;
      border-bottom: 1px solid #183c37;
    }

    #showTime {
      position: absolute;
      right: 0;
      top: 4px;
      font: 13px monospace;
      color: var(--muted);
    }

    .container {
      width: 100%;
      min-height: 240px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 18px 0 32px;
    }

    .cube {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      align-content: flex-start;
      perspective: 600px;
      transition: gap 0.55s ease;
    }

    .face {
      overflow: hidden;
      flex: 0 0 auto;
      width: 100px;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #aaa;
      background-color: var(--panel-bg);
      color: var(--text);
      transform-style: preserve-3d;
      will-change: transform, opacity;
      transition:
        width 0.45s ease,
        height 0.45s ease,
        border-radius 0.45s ease,
        background-color 0.45s ease,
        color 0.45s ease,
        box-shadow 0.45s ease;
    }

    .face > input {
      background: transparent;
      outline: none;
      width: 80%;
      min-width: 0;
      color: inherit;
      text-align: center;
      border: none;
      font: inherit;
      font-size: 22px;
    }

    .controller {
      position: fixed;
      z-index: 5;
      left: 12px;
      right: 12px;
      bottom: 12px;
      max-height: 48vh;
      overflow: auto;
      padding: 12px;
      border: 1px solid #12685a;
      border-radius: 12px;
      background: rgb(12 18 18 / 96%);
      box-shadow: 0 0 24px rgb(0 255 204 / 8%);
      backdrop-filter: blur(10px);
    }

    #controller {
      display: flex;
      align-items: end;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      min-width: 115px;
      flex: 1 1 125px;
      text-align: left;
    }

    .input-group label {
      font-size: 12px;
      color: var(--muted);
    }

    .input-group input:not([type="range"]),
    .input-group select,
    .input-group button {
      min-width: 0;
      width: 100%;
      padding: 8px 9px;
      border: 1px solid #315b54;
      border-radius: 6px;
      outline: none;
      background: #101818;
      color: var(--text);
      font: inherit;
    }

    .input-group input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .input-group select { cursor: pointer; }
    .input-group button { cursor: pointer; }
    .input-group button:hover { border-color: var(--accent); }

    .range-value {
      font-size: 12px;
      align-self: flex-end;
      color: var(--muted);
    }

    .animation-group { flex: 1.5 1 180px; }

    .animation-status {
      flex: 1 1 100%;
      margin: 0;
      text-align: left;
      color: var(--muted);
      font-size: 12px;
    }

    .animation-status strong { color: var(--accent); }

    /* FLIP helper: temporary transform is applied by JavaScript. */
    .face.flip-animating { will-change: transform; }

    @keyframes spinCube {
      0%   { transform: rotateY(0deg) rotateX(0deg); }
      100% { transform: rotateY(360deg) rotateX(360deg); }
    }

    @keyframes purse {
      0%, 100% { transform: scale(1) rotate(0deg); }
      25% { transform: scale(.82) rotate(-7deg); }
      50% { transform: scale(1.12) rotate(7deg); }
      75% { transform: scale(.92) rotate(-3deg); }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-24px); }
    }

    @keyframes fade {
      0%, 100% { opacity: 1; }
      50% { opacity: .2; }
    }

    @keyframes wave {
      0%, 100% { transform: translateY(0) rotate(0); }
      25% { transform: translateY(-16px) rotate(-3deg); }
      75% { transform: translateY(16px) rotate(3deg); }
    }

    @keyframes flip {
      0%, 100% { transform: rotateY(0deg); }
      50% { transform: rotateY(180deg); }
    }

    @keyframes zoom {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.16); }
    }

    @keyframes rotateX {
      0%, 100% { transform: perspective(600px) rotateX(0); }
      50% { transform: perspective(600px) rotateX(180deg); }
    }

    @keyframes rotateY {
      0%, 100% { transform: perspective(600px) rotateY(0); }
      50% { transform: perspective(600px) rotateY(180deg); }
    }

    @keyframes rotateZ {
      0%, 100% { transform: rotateZ(0); }
      50% { transform: rotateZ(180deg); }
    }

    @keyframes swing {
      0%, 100% { transform: rotate(0); }
      25% { transform: rotate(12deg); }
      75% { transform: rotate(-12deg); }
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 rgb(0 255 204 / 0%); }
      50% { box-shadow: 0 0 24px rgb(0 255 204 / 55%); }
    }

    .face.anim-spin-cube { animation: spinCube 2.2s linear infinite; }
    .face.anim-purse { animation: purse 1.1s ease-in-out infinite; }
    .face.anim-bounce { animation: bounce .85s ease-in-out infinite; }
    .face.anim-fade { animation: fade 1.4s ease-in-out infinite; }
    .face.anim-wave { animation: wave 1.2s ease-in-out infinite; }
    .face.anim-flip { animation: flip 1.6s ease-in-out infinite; }
    .face.anim-zoom { animation: zoom 1.2s ease-in-out infinite; }
    .face.anim-rotate-x { animation: rotateX 1.8s ease-in-out infinite; }
    .face.anim-rotate-y { animation: rotateY 1.8s ease-in-out infinite; }
    .face.anim-rotate-z { animation: rotateZ 1.8s ease-in-out infinite; }
    .face.anim-swing { animation: swing 1.1s ease-in-out infinite; }
    .face.anim-pulse { animation: pulse 1.4s ease-in-out infinite; }

    /* Small stagger makes group animations feel more natural. */
    .face:nth-child(2) { animation-delay: .08s; }
    .face:nth-child(3) { animation-delay: .16s; }
    .face:nth-child(4) { animation-delay: .24s; }
    .face:nth-child(5) { animation-delay: .32s; }
    .face:nth-child(6) { animation-delay: .40s; }

    @media (max-width: 600px) {
      body { padding: 10px 10px 310px; }
      h2 { font-size: 19px; padding: 0 0 38px; }
      #showTime { top: 30px; left: 0; right: 0; font-size: 11px; }
      .container { padding-top: 10px; }
      .controller {
        left: 6px;
        right: 6px;
        bottom: 6px;
        max-height: 55vh;
        padding: 9px;
      }
      #controller { gap: 9px; }
      .input-group { flex-basis: 105px; }
      .animation-group { flex-basis: 150px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .face, .cube { transition-duration: .01ms !important; }
      .face[class*="anim-"] { animation-duration: 3s !important; }
    }
  </style>
</head>
<body>
  <h2>
    ISAAC FLEX BOX
    <span id="showTime"></span>
  </h2>

  <div class="container">
    <div class="cube">
      <div class="face"><input type="text" value="1" aria-label="Face 1"></div>
      <div class="face"><input type="text" value="2" aria-label="Face 2"></div>
      <div class="face"><input type="text" value="3" aria-label="Face 3"></div>
      <div class="face"><input type="text" value="4" aria-label="Face 4"></div>
      <div class="face"><input type="text" value="5" aria-label="Face 5"></div>
      <div class="face"><input type="text" value="6" aria-label="Face 6"></div>
    </div>
  </div>

  <div class="controller">
    <form id="controller">
      <div class="input-group">
        <label for="flexStyle">Layout</label>
        <select id="flexStyle">
          <option value="flex" selected>Flex</option>
          <option value="grid">Grid</option>
        </select>
      </div>

      <div class="input-group">
        <label for="flexDirection">Flex direction</label>
        <select id="flexDirection">
          <option value="row" selected>row</option>
          <option value="column">column</option>
          <option value="row-reverse">row-reverse</option>
          <option value="column-reverse">column-reverse</option>
        </select>
      </div>

      <div class="input-group">
        <label for="gridColumns">Grid columns</label>
        <select id="gridColumns">
          <option value="2">2 columns</option>
          <option value="3" selected>3 columns</option>
          <option value="4">4 columns</option>
          <option value="6">6 columns</option>
        </select>
      </div>

      <div class="input-group">
        <label for="gap">Gap (px)</label>
        <input type="number" id="gap" min="0" max="200" value="10">
      </div>

      <div class="input-group">
        <label for="width">Face width</label>
        <input type="range" id="width" min="10" max="200" value="100">
        <span class="range-value" id="widthNumber">100px</span>
      </div>

      <div class="input-group">
        <label for="height">Face height</label>
        <input type="range" id="height" min="10" max="200" value="100">
        <span class="range-value" id="heightNumber">100px</span>
      </div>

      <div class="input-group">
        <label for="borderRadius">Border radius</label>
        <input type="number" id="borderRadius" min="0" value="0">
      </div>

      <div class="input-group">
        <label for="radiusUnit">Radius unit</label>
        <select id="radiusUnit">
          <option value="px">px</option>
          <option value="%">%</option>
          <option value="rem">rem</option>
          <option value="em">em</option>
        </select>
      </div>

      <div class="input-group">
        <label for="bgColor">Background color</label>
        <input type="text" value="rgb(20,20,20)" id="bgColor">
      </div>

      <div class="input-group animation-group">
        <label for="animation">Animation (choose again to stop)</label>
        <select id="animation">
          <option value="none" selected>None</option>
          <option value="spin-cube">Spin Cube</option>
          <option value="purse">Purse / Squish</option>
          <option value="bounce">Bounce</option>
          <option value="fade">Fade</option>
          <option value="wave">Wave</option>
          <option value="flip">Flip</option>
          <option value="zoom">Zoom</option>
          <option value="rotate-x">Rotate X</option>
          <option value="rotate-y">Rotate Y</option>
          <option value="rotate-z">Rotate Z</option>
          <option value="swing">Swing</option>
          <option value="pulse">Glow Pulse</option>
        </select>
      </div>

      <div class="input-group">
        <label for="animationSpeed">Animation speed</label>
        <select id="animationSpeed">
          <option value="0.5">Very fast</option>
          <option value="1" selected>Normal</option>
          <option value="1.7">Slow</option>
          <option value="2.5">Very slow</option>
        </select>
      </div>

      <div class="input-group">
        <label for="toggleAnimation">&nbsp;</label>
        <button type="button" id="toggleAnimation">Start / Pause selected</button>
      </div>
      <div class="input-group">
        <label>&nbsp;</label>
        <button type="button" id="stopAnimation">Stop / None</button>
      </div>

      <p class="animation-status" id="animationStatus" aria-live="polite">
        Animation: <strong>None</strong>. Choose an effect from the dropdown.
      </p>
    </form>
  </div>

  <script>
    const showTime = document.getElementById('showTime');
    const cube = document.querySelector('.cube');
    const faces = [...document.querySelectorAll('.face')];

    const flexStyle = document.getElementById('flexStyle');
    const flexDirection = document.getElementById('flexDirection');
    const gridColumns = document.getElementById('gridColumns');
    const gap = document.getElementById('gap');
    const width = document.getElementById('width');
    const height = document.getElementById('height');
    const widthNumber = document.getElementById('widthNumber');
    const heightNumber = document.getElementById('heightNumber');
    const borderRadius = document.getElementById('borderRadius');
    const radiusUnit = document.getElementById('radiusUnit');
    const bgColor = document.getElementById('bgColor');
    const animationSelect = document.getElementById('animation');
    const animationSpeed = document.getElementById('animationSpeed');
    const toggleAnimationButton = document.getElementById('toggleAnimation');
    const stopAnimationButton = document.getElementById('stopAnimation');
    const animationStatus = document.getElementById('animationStatus');

    let activeAnimation = 'none';
    let activeAnimationSpeed = Number(animationSpeed.value);

    function updateClock() {
      showTime.textContent = new Date().toLocaleTimeString();
    }
    updateClock();
    setInterval(updateClock, 1000);


    function animateLayoutChange(changeLayout) {
      const first = faces.map(face => face.getBoundingClientRect());

      changeLayout();


      const last = faces.map(face => face.getBoundingClientRect());

      faces.forEach((face, index) => {
        const dx = first[index].left - last[index].left;
        const dy = first[index].top - last[index].top;

        if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return;

        face.animate(
          [
            { transform: `translate(${dx}px, ${dy}px)` },
            { transform: 'translate(0, 0)' }
          ],
          {
            duration: 550,
            easing: 'cubic-bezier(.2,.75,.25,1)'
          }
        );
      });
    }

    function applyLayout() {
      animateLayoutChange(() => {
        const isGrid = flexStyle.value === 'grid';
        cube.style.display = flexStyle.value;

        if (isGrid) {
          cube.style.gridTemplateColumns =
            `repeat(${gridColumns.value}, max-content)`;
          cube.style.flexDirection = '';
          cube.style.flexWrap = '';
        } else {
          cube.style.gridTemplateColumns = '';
          cube.style.flexDirection = flexDirection.value;
          cube.style.flexWrap = 'wrap';
        }
      });
    }

    flexStyle.addEventListener('change', applyLayout);
    flexDirection.addEventListener('change', () => {
      if (flexStyle.value === 'flex') applyLayout();
    });
    gridColumns.addEventListener('change', () => {
      if (flexStyle.value === 'grid') applyLayout();
    });

    gap.addEventListener('input', () => {
      const value = Math.max(0, Math.min(200, Number(gap.value) || 0));
      cube.style.gap = `${value}px`;
    });

    width.addEventListener('input', () => {
      widthNumber.textContent = `${width.value}px`;
      faces.forEach(face => face.style.width = `${width.value}px`);
    });

    height.addEventListener('input', () => {
      heightNumber.textContent = `${height.value}px`;
      faces.forEach(face => face.style.height = `${height.value}px`);
    });

    function updateRadius() {
      const value = Math.max(0, Number(borderRadius.value) || 0);
      faces.forEach(face => {
        face.style.borderRadius = `${value}${radiusUnit.value}`;
      });
    }
    borderRadius.addEventListener('input', updateRadius);
    radiusUnit.addEventListener('change', updateRadius);

    bgColor.addEventListener('input', () => {

      if (CSS.supports('background-color', bgColor.value.trim())) {
        faces.forEach(face => face.style.backgroundColor = bgColor.value.trim());
      }
    });

    const animationClasses = [
      'anim-spin-cube', 'anim-purse', 'anim-bounce', 'anim-fade',
      'anim-wave', 'anim-flip', 'anim-zoom', 'anim-rotate-x',
      'anim-rotate-y', 'anim-rotate-z', 'anim-swing', 'anim-pulse'
    ];

    const animationClassByValue = {
      'spin-cube': 'anim-spin-cube',
      'purse': 'anim-purse',
      'bounce': 'anim-bounce',
      'fade': 'anim-fade',
      'wave': 'anim-wave',
      'flip': 'anim-flip',
      'zoom': 'anim-zoom',
      'rotate-x': 'anim-rotate-x',
      'rotate-y': 'anim-rotate-y',
      'rotate-z': 'anim-rotate-z',
      'swing': 'anim-swing',
      'pulse': 'anim-pulse'
    };

    function updateAnimationStatus() {
      const label = animationSelect.options[animationSelect.selectedIndex].text;
      animationStatus.innerHTML = activeAnimation === 'none'
        ? 'Animation: <strong>None</strong>. Choose an effect from the dropdown.'
        : `Animation: <strong>${label}</strong> is running. Choose it again or press Stop to turn it off.`;
    }

    function stopAnimation(resetDropdown = true) {
      faces.forEach(face => {
        face.classList.remove(...animationClasses);
        face.style.animationDuration = '';
      });
      activeAnimation = 'none';

      if (resetDropdown) animationSelect.value = 'none';
      updateAnimationStatus();
    }

    function startAnimation(name) {
      stopAnimation(false);

      if (name === 'none') {
        animationSelect.value = 'none';
        updateAnimationStatus();
        return;
      }

      activeAnimation = name;
      const className = animationClassByValue[name];

      faces.forEach(face => {
        face.classList.add(className);
        face.style.animationDuration =
          `${baseDurationFor(name) * activeAnimationSpeed}s`;
      });

      updateAnimationStatus();
    }

    function baseDurationFor(name) {
      return {
        'spin-cube': 2.2,
        'purse': 1.1,
        'bounce': .85,
        'fade': 1.4,
        'wave': 1.2,
        'flip': 1.6,
        'zoom': 1.2,
        'rotate-x': 1.8,
        'rotate-y': 1.8,
        'rotate-z': 1.8,
        'swing': 1.1,
        'pulse': 1.4
      }[name] || 1.2;
    }

    animationSelect.addEventListener('change', () => {

      startAnimation(animationSelect.value);
    });

    toggleAnimationButton.addEventListener('click', () => {
      const selected = animationSelect.value;

      if (selected === 'none') {
        stopAnimation();
      } else if (activeAnimation === selected) {
        stopAnimation(false);
      } else {
        startAnimation(selected);
      }
    });

    animationSpeed.addEventListener('change', () => {
      activeAnimationSpeed = Number(animationSpeed.value);
      if (activeAnimation !== 'none') {
        startAnimation(activeAnimation);
      }
    });

    stopAnimationButton.addEventListener('click', () => stopAnimation());

    document.getElementById('controller').addEventListener('submit', event => {
      event.preventDefault();
    });


    applyLayout();
  </script>
</body>
</html>
