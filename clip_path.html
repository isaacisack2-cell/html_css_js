<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS CLIP PATH</title>
    <style>
        h1{
            background-color: #D5E601;
            padding: 20px;
            width: 150px;
            clip-path: polygon(
                0% 0%,
                75% 0%,
                100% 50%,
                75% 100%,
                0% 100%,
                0% 0%
            );
        }
    </style>
</head>
<body>
    <h1>ISAAC JOUNER</h1>
</body>
</html>
