<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            height: 100vh;
            background: linear-gradient(90deg,#0aa 0% 1px,transparent 1px 100%),
                        linear-gradient(0deg,#0aa 0% 1px, transparent 1px 100%);
            background-size: 40px 40px;
        }

        .container{
            width: 200px;
            height: 200px;
            transition: all 0.1s ease;
            perspective: 500px;
        }

        .cube{
            width: 100px;
            height: 100px;
            position: relative;
            transform-style: preserve-3d;
            animation: spin 10s infinite linear;
        }

        .face{
            position: absolute;
            width: 200px;
            height: 200px;
            border: 1px solid #000;
            background-color: rgba(255,0,0,0.5);
            text-align: center;
            line-height: 100px;
            color:#FFF;
            font-size: 23px;
        }

        .cube div:nth-child(1){transform: rotateY(0deg) translateZ(100px);}
        .cube div:nth-child(2){transform: rotateY(180deg) translateZ(100px);}
        .cube div:nth-child(3){transform: rotateY(90deg) translateZ(100px);}
        .cube div:nth-child(4){transform: rotateY(-90deg) translateZ(100px);}
        .cube div:nth-child(5){transform: rotateX(90deg) translateZ(100px);}
        .cube div:nth-child(6){transform: rotateX(-90deg) translateZ(100px);}

        @keyframes spin {
            from{transform: rotateX(0deg) rotateY(0deg);}
            to{transform: rotateX(360deg) rotateY(360deg);}
        }
    </style>
</head>
<body style="display: flex;justify-content: center;align-items: center;">
    <div class="container">
        <div class="cube">
            <div class="face"><img src="pictures/atc.jpg" width="100%" height="100%" loading="lazy"></div>
            <div class="face"><img src="pictures/baboon.jpg" width="100%" height="100%" loading="lazy"></div>
            <div class="face"><img src="pictures/coast sun set.jpg" alt="sunset" width="100%" height="100%" loading="lazy"></div>
            <div class="face"><img src="pictures/tigers.jpg" alt="tigers" width="100%" height="100%" loading="lazy"></div>
            <div class="face"><img src="pictures/ict.jpg" alt="ICT" width="100%" height="100%" loading="lazy"></div>
            <div class="face"><img src="pictures/lion king.jpg" alt="Lion king" width="100%" height="100%" loading="lazy"></div>
        </div>
    </div>
</body>
</html>
