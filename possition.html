<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS position</title>
    <style>
        body{
            background: #031303;
            color: #A2E3D4;
            font-family: sans-serif;
        }
        .box{
            width: 100%;
            max-width: 660px;
            height: 160px;
            border: 1px solid #A2E3D4;
            font-size: 1.6rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .circle{
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 1px solid #A7B0A9;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .static{
            background-color: rgb(21,52,71);
        }
        .relative{
            position: relative;
            top: 20px;
            left: 50px;
        }

        .absolute{
            position: absolute;
            top: 10px;
            left: 10px;
            box-shadow: inset 0 0 20px #F0FFF1;
            animation: blink 10s infinite;
            transition: border 0.5s ease,box-shadow 0.4s ease;
        }
        @keyframes blink {
            50%{border: none;box-shadow: none;}
        }

        .grid{
            background: linear-gradient(90deg,#62E3D4 1px,transparent 1px),linear-gradient(0deg,#62E3D4 1px,transparent 1px);
            background-size:20px 20px;
            mask-image: radial-gradient(at center,black,transparent 70%);
            pointer-events: all;
            position: relative;
            top: 50px;
        }

        .terminal{
            background-color: #000;
            position: relative;
            top: 50px;
            display: flex;
            flex-direction: column;
            gap: 0;
            padding: 0;
            height: 450px;
            margin-bottom: 100px;
        }

        .terminal-component{
            border-bottom:1px solid;
            width: 100%;
            height: auto;
            position: relative;
        }

        #terminal-bar{
            height: 100px;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
        }

        #bar-circles{
            display: flex;
            width: 50%;
            padding: 0 20px;
            margin: 0;
            gap: 10px;
            position:absolute;
            right: 0;
            top: 50px;
            display: flex;
            justify-content: end;
            align-items: end;
        }

        .bar-circle{
            width: 15px;
            height: 15px;
            border-radius: 50%;
            border: 1px solid #A2E3D4;
        }

        #red-circle{
            background-color: #FF0000;
        }

        #yellow-circle{
            background-color: #FFFF00;
        }

        #green-circle{
            background-color: #00FF00;
        }

        #terminal-box{
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 400px;
            top: 100px;
            font-size: 16px;
            padding: 20px 6px;
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        #terminal-box #terminal-path{
            color: #FFF;
        }

        #terminal-input{
            width: 99%;
            display: flex;
            flex-direction: row;
            gap:3px;
            transition: all 0.2s ease-out;
        }

        #terminal-output{
            height: 260px;
            width: 99%;
            overflow-y: auto;
            transition: all 2s ease-in-out;
        }

        #cursor{
            width: 1px;
            height: 20px;
            background-color: #FFF;
            animation: cursor-blink 1s infinite;
        }

        @keyframes cursor-blink {
            50%{opacity: 0;}
        }
    </style>
</head>
<body>
    <div class="box static">static position</div>
    <div class="box relative">
        <p>Relative Position</p>
        <div class="circle absolute">Absolute position</div>
    </div>
    <div class="box grid">MY Grid</div>

    <div class="box terminal" id="terminal">
        <div class="terminal-component" id="terminal-bar">
            <p><span style="background: linear-gradient(90deg,#00F 10%,#0F0 26% 75%,#F00 75%);background-clip: text;-webkit-text-fill-color: transparent;">ISAAC</span> <span style="color: #AFBF4a !important;">CMD</span></p>
            <span id="bar-circles">
                <span class="bar-circle" id="red-circle"></span>
                <span class="bar-circle" id="yellow-circle"></span>
                <span class="bar-circle" id="green-circle"></span>
            </span>
        </div>
        <div class="terminal-component" id="terminal-box">
            <span id="terminal-input">
            <span id="terminal-path">~/home ></span><span id="terminal-command"></span><span id="cursor"></span>
            </span>
            <span id="terminal-output"></span>
        </div>
    </div>

    <script>
        const terminal_command = document.getElementById('terminal-command');
        const terminal_output = document.getElementById('terminal-output');
        const cli = [
            {command:"whoami",output:"Isaac_isack@127.0.0.1"},
            {command:"help",output:"-Web development <br>-server configuration<br>-network Troubleshooting<br>-Computer achitecture"},
            {command:"ls",output:"<ul><li>python</li><li>PHP</li><li>SQL</li><li>JAVA</li><li>JavaScript</li></ul>"},
            {command:"DIR",output:"web developer <br>Ethical Hacker <br>System Admin<br>"}
        ];

        let index = 0;
        const display_timer = setInterval(() =>{
            if(index >= cli.length){
                index = 0;
                terminal_output.innerHTML = "";
            }
            let span = document.createElement("span");
            span = "<br>$> "+cli[index]['output'];            terminal_command.innerText = cli[index]["command"];
            setTimeout(()=>{
                terminal_output.innerHTML += span;
                index++;
            },700);
        },3000);
    </script>
</body>
</html>
