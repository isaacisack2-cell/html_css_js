<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISAAC PASSWORD GENERATOR</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <style>
        body{
            height:100dvh;
            width:100dvw;
            padding: 0;
        }

        .hidden{
            display: none;
        }

        @media (max-width : 768px) {
            #mobile{display:block;}
            #pc{display: none;}
        }
        @media (min-width : 768px){
            #mobile{display: none;}
            #pc{display: block;}
        }
    </style>
</head>
<body>
    <!-- header -->
    <header>
        <h1 class="text-info bg-dark text-center py-3 mt-3">ISAAC PASSWORD MACHINE</h1>
        <nav class="pt-1">
            <ul class="nav nav-tabs">
                <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#generate">GENERATE</button></li>
                <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#check">CHECK</button></li>
            </ul>
        </nav>
    </header>
    <div class="container-fluid">
        <div class="tab-content">
            <!-- home tab -->
            <div class="tab-pane fade show active" id="generate">
                <div class="row">
                    <!-- left menu -->
                     <!-- mobile tabs -->
                    <div class="col-12 mobile text-info" id="mobile">
                        <div class="dropdown">
                            <button class="btn btn-outline-primary dropdown-toggle" data-bs-toggle="dropdown">
                                Select Priority
                            </button>
                            <ul class="dropdown-menu dropdown-menu-end">  
                                <ul class="nav nav-pills">
                                    <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#normalUserPage">Normal User</button></li>
                                    <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#administratorUserPage">Administrator</button></li>
                                    <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#politicsUserPage">Politics</button></li>
                                </ul>
                            </ul>
                        </div>
                    </div>
                    <!-- pc tabs -->
                    <ul class="col-3 nav nav-pills text-primary" id="pc">
                        <div class="bg-dark py-3 mt-4 rounded">
                            <li class="nav-item my-5"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#normalUserPage">NORMAL USER</button></li>
                            <li class="nav-item my-5"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#administratorUserPage">ADMINISTRATORS USER</button></li>
                            <li class="nav-item my-5"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#politicsUserPage">POLITICS USER</button></li>
                        </div>
                    </ul>
                                        
                    <!-- right contents -->
                     <div class="col-sm-12 col-md-8 bg-dark mt-4 mb-0 mr-0 text-primary">
                        <div class="tab-content">

                            <!-- normal user page -->
                            <div class="tab-pane active show fade" id="normalUserPage">
                                <h5 class="text-primary text-center mt-3">NORMAL USER PASSWORD GENERATION</h5>
                                <div class="col-12 py-5 justify-content-center">
                                    <div class="card p-5 mx-5">
                                        <form method="post" id="normalUserForm">
                                            <div class="mb-4">
                                                <label for="firstName" class="form-label">First Name</label>
                                                <input type="text" name="Fname" id="firstName" placeholder="Enter first name" required class="form-control">
                                            </div>

                                            <div class="mb-4">
                                                <label for="lastName" class="form-label">Last Name</label>
                                                <input type="text" name="Lname" id="lastName" class="form-control" placeholder="Enter last name" required>
                                            </div>

                                            <div class="mb-4">
                                                <label for="gender" class="form-label">Select Gender</label><br>
                                                <div class="btn-group">
                                                    <input type="radio" name="gender" id="male" value="male" class="btn-check" required>
                                                    <label for="male" class="btn btn-outline-primary">MALE</label>

                                                    <input type="radio" name="gender" id="female" value="female" class="btn-check" required>
                                                    <label for="female" class="btn btn-outline-success">FEMALE</label>
                                                </div>
                                            </div>

                                            <div class="mb-4 hidden" id="hiddenField">
                                                <input type="password" class="form-controll" id="password" name="password" readonly>
                                                <button type="button" class="btn btn-outline-mutable btn-sm" onclick="show_password();" id="showPasswordBtn">show</button>
                                                <button type="button" class="btn btn-outline-secondary btn-sm" onclick="copy_password();">Copy</button><br>
                                                <p class="text-danger text-sm" id="timeCounter">Password will disappear after 30 seconds</p>
                                            </div>

                                            <button class="btn btn-primary rounded-pill w-100" type="submit">GENERATE</button>
                                        </form>
                                    </div>
                                </div>
                            </div>

                            <!-- admin user page -->
                            <div class="tab-content fade" id="administratorUserPage">
                                <div class="container">
                                    <div class="row">
                                        <div class="col-9">
                                            <div class="card p-5 mt-5 rounded shadow">
                                                <form method="post" id="administratorForm">
                                                    <div class="mb-4">
                                                        <label for="oraganisation" class="form-label">Organisation</label>
                                                        <select name="organisation" id="organisation" class="form-control">
                                                            <option value="school" selected>School</option>
                                                            <option value="company">Company</option>
                                                            <option value="hospital">Hospital</option>
                                                            <option value="market">Market</option>
                                                        </select>
                                                    </div>

                                                    <div class="mb-4">
                                                        <label for="organisationName" class="form-label">Organisation Name</label>
                                                        <input type="text" name="organisationName" id="organisationName" class="form-control" required autocapitalize="true" autocorrect="on" autocomplete="home">
                                                    </div>

                                                    <button type="submit" id="administratorFormSubmitBtn" class="btn btn-outline-primary w-100 rounded-pill" data-bs-toggle="modal" data-bs-target="#myModal">GENERATE</button>
                                                    <div class="modal fade" id="myModal">
                                                        <div class="modal-dialog modal-dialog-centered">
                                                            <div class="modal-content">
                                                                <div class="modal-header">
                                                                    <h3 class="modal-title">Administrator's Password</h3>
                                                                    <button class="btn-close" data-bs-dismiss="modal"></button>
                                                                </div>
                                                                <div class="modal-body">
                                                                    <p class="modal-text">This password is generated for administartor only<br>Keep it <strong>SECRETE</strong></p>
                                                                    <input type="password" readonly id="administartorGeneratedPassword" class="form-control" value=" ">
                                                                </div>
                                                                <div class="modal-footer">
                                                                    <button class="btn btn-success" id="administartorGeneratedPasswordCopy">copy</button>
                                                                    <button class="btn btn-danger" data-bs-dismiss="modal">Close</button>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </form>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- politics user page -->
                            <div class="tab-pane fade" id="politicsUserPage">
                                <div class="row">
                                    <div class="col-12 p-5">
                                        <div class="card m-3 p-5">
                                            <form action="" method="post" id="politicsForm">
                                                <div class="mb-4">
                                                    <label for="politicName" class="form-label">Enter Full Name</label>
                                                    <input type="text" name="politicName" id="politicName" class="form-control" required>
                                                </div>

                                                <div class="mb-4">
                                                    <label for="politicalParty" class="form-label">Political Party</label>
                                                    <input type="text" name="politicalParty" id="politicalParty" class="form-control" required>
                                                </div>

                                                <div class="mb-4">
                                                    <div class="dropdown">
                                                        <label for="country" class="form-label">Select Country</label>
                                                        <button class="btn btn-secondary dropdown-toggle" data-bs-toggle="dropdown"></button>
                                                        <ul class="dropdown-menu">
                                                            <li class="dropdown-item">Tanzania</li>
                                                            <li class="dropdown-item">Kenya</li>
                                                            <li class="dropdown-item">Uganda</li>
                                                            <li class="dropdown-item">Rwanda</li>
                                                            <li class="dropdown-item">Burundi</li>
                                                        </ul>
                                                    </div>
                                                </div>
                                            </form>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                     </div>
                </div>
            </div>

            <!-- check tab -->
            <div class="tab-pane fade" id="check">
                <div class="container-fluid bg-dark w-100 h-100 text-info p-5">
                    <div class="row">
                        <div class="col-1"></div>
                        <div class="col-10">
                            <div class="card p-5">
                                <form action="" id="checkPasswordForm">
                                    <div class="mb-4">
                                        <label for="passwordCheckInput" class="form-label">Enter Your Password</label>
                                        <input type="password" name="passwordCheck" id="passwordCheckInput" required class="form-control">
                                    </div>
                                    <button type="submit" class="btn btn-outline-info rounded-pill w-100 m-3">Check Password</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- displaying password report -->
                <div class="container-fluid bg-dark text-primary">
                    <div class="row">
                        <div class="col-12">
                            <span class="mr-5">Password: </span><span id="passwordValue"></span><br>
                            <span class="mr-5">Length: </span><span id="passwordLength"></span><br>
                            <span class="mr-5">Strength: </span><span id="passwordStrength"></span><br><br>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/bootstrap.bundle.js"></script>
    <script>
        const password = document.getElementById('password');
        const showBtn = document.getElementById('showPasswordBtn');
        const hiddenField = document.getElementById('hiddenField');
        let timeCounter = document.getElementById('timeCounter');
        const firstName = document.getElementById('firstName');
        const lastName = document.getElementById('lastName');
        const selectedGender = document.querySelectorAll('input[name="gender"]');
        const normalUserForm = document.getElementById('normalUserForm');
        const passwordValue = document.getElementById('passwordValue');
        const passwordLength = document.getElementById('passwordLength');
        const passwordStrength = document.getElementById('passwordStrength');
        const passwordCheckInput = document.getElementById('passwordCheckInput');
        const checkPasswordForm = document.getElementById('checkPasswordForm');
        let normalUserGeneratedPassword = "";
        let adminPassword = "";

        //function to get gender
        function get_gender(){
            if(selectedGender[0].checked){return selectedGender[0].value}else if(selectedGender[1].checked){return selectedGender[1].value}else{return null};
        }

        //function to clear form inputs
        function clear_form_inputs(){
            firstName.value = "";
            lastName.value = "";
        }

        //function to copy password
        function copy_password(){
            password.select();
            password.setSelectionRange(0,99999);
            navigator.clipboard.writeText(password.value);
            alert("Password copied");
        }

        //function to toggle password type
        function show_password(){
            if(password.type == "password"){
                password.type = "text";
                showBtn.innerText = "hide";
            }else{
                password.type = "password";
                showBtn.innerText = "show";
            }     
        }

        //function to generate password
        function generate_password(){
            if(normalUserGeneratedPassword != ""){normalUserGeneratedPassword = ""};
            rawPool = firstName.value + lastName.value + get_gender() + "123-_";
            pool = rawPool.split("");
            for(let i = 0 ; i < 8 ; i++){
                let charIndex = Math.floor(Math.random() * pool.length);
                console.log(charIndex);
                normalUserGeneratedPassword += pool[charIndex];
            }
            clear_form_inputs();
            hiddenField.style.display = "block";
            password.value = normalUserGeneratedPassword;

            let time = 30;
            const timeCounterInterval = setInterval(()=>{
                if(time > 0){time--}else{hiddenField.style.display = "none";clearInterval(timeCounterInterval);}
                timeCounter.textContent = `Password will disappear after ${time} seconds`;
                console.log(timeCounter.innerText);
            },1000);
            
        }

        normalUserForm.addEventListener('submit',e=>{
            e.preventDefault();
            generate_password();
        });

        //function to check for password Strength
        function checkPassword(password){
            let is_strong = false;
            passwordLength.innerText = password.length;
            passwordValue.innerText = password;
            passwordStrength.innerHTML = `<button class="btn btn-outline-primary btn-sm ml-3"><span class="spinner-border spinner-border-sm"></span>Checking</button>`;
            setTimeout(()=>{
                if(password.length < 8){
                    passwordStrength.innerText = "Weak password. Your password is very short";
                }else if(!/[\.@!-_\$%#\*]/.test(password)){
                    passwordStrength.innerText = "Weak Password. There is no any punctuation";
                }else if(!/[A-Z]/.test(password)){
                    passwordStrength.innerText = "There is no Uppercase letters";
                }else if(!/[a-z]/.test(password)){
                    passwordStrength.innerText = "There is no LowerCase letters";
                }else if(!/\d/.test(password)){
                    passwordStrength.innerText = "There is no any number in password";
                }else{
                    is_strong = true;
                    if(password.length >= 20) passwordStrength.innerText = "Your password is very strong ⭐⭐⭐⭐⭐";
                    else if(password.length >= 15) passwordStrength.innerText = "strong password ⭐⭐⭐";
                    else passwordStrength.innerText = "Good password ⭐⭐";
                }
                (is_strong)?  passwordStrength.style.color = "#00FF00":passwordStrength.style.color = "#FF0000";
            },5000);

        }

        checkPasswordForm.addEventListener('submit',(e) => {
            e.preventDefault();
            checkPassword(passwordCheckInput.value);
        });
    
        //function to generate admin password
        function generate_admin_password(){
            adminPassword = "";
            let adminRawPool = document.getElementById('organisation').value + document.getElementById('organisationName').value + "0123456789" + ",-@#$*|";
            let pool = adminRawPool.split("");
            const passLen = [8,10,11,15,20,23];
            let len = passLen[Math.floor((Math.random() * passLen.length) - 2)];
            console.log(len);
            for(let i = 0 ; i <= len ; i++){
                adminPassword += pool[Math.floor(Math.random() * pool.length - 1)];
            }
            return adminPassword;
        }

        document.getElementById('administratorForm').addEventListener('submit',(e)=>{
            e.preventDefault();
            document.getElementById('administartorGeneratedPassword').value = generate_admin_password();
        });

        document.getElementById('administartorGeneratedPasswordCopy').addEventListener('click',() => {
            document.getElementById('administartorGeneratedPassword').value.select;
            window.navigator.clipboard.writeText(document.getElementById('administartorGeneratedPassword').value);
            alert("password copied to clipboard");
        });
    </script>
</body>
</html>
